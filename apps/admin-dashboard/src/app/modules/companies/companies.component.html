<div class="flex min-w-0 flex-auto flex-col">
    <div class="flex items-center justify-between px-6 py-4 sm:px-10">
        <div>
            <h1 class="text-2xl font-semibold leading-tight">
                Compañías
            </h1>
            <p class="text-secondary text-sm">
                Gestión de compañías registradas en el sistema.
            </p>
        </div>
        <button mat-flat-button color="primary" (click)="openCreateDialog()">
            Crear compañía
        </button>
    </div>

    <div class="flex-auto px-6 pb-6 sm:px-10 sm:pb-10">
        <div class="bg-card rounded-2xl p-4 shadow">
            <div
                class="flex h-32 items-center justify-center text-secondary"
                *ngIf="loading(); else tableTpl"
            >
                Cargando compañías...
            </div>

            <ng-template #tableTpl>
                <table
                    mat-table
                    class="companies-table w-full"
                    *ngIf="companies().length > 0; else emptyTpl"
                    [dataSource]="companies()"
                >
                    <ng-container matColumnDef="name">
                        <th mat-header-cell *matHeaderCellDef>Nombre</th>
                        <td mat-cell *matCellDef="let company">
                            {{ company.name }}
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="owner">
                        <th mat-header-cell *matHeaderCellDef>Propietario</th>
                        <td mat-cell *matCellDef="let company">
                            {{ company.ownerName || company.ownerEmail || company.ownerUserId }}
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="status">
                        <th mat-header-cell *matHeaderCellDef>Estado</th>
                        <td mat-cell *matCellDef="let company">
                            <span
                                class="rounded-full px-3 py-1 text-xs font-semibold"
                                [class.bg-green-100]="!company.isArchived"
                                [class.text-green-800]="!company.isArchived"
                                [class.bg-gray-200]="company.isArchived"
                                [class.text-gray-700]="company.isArchived"
                            >
                                {{ company.isArchived ? 'Archivada' : 'Activa' }}
                            </span>
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef></th>
                        <td mat-cell *matCellDef="let company">
                            <button mat-stroked-button color="primary" disabled>
                                Ver
                            </button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr
                        mat-row
                        *matRowDef="let row; columns: displayedColumns"
                    ></tr>
                </table>

                <ng-template #emptyTpl>
                    <div class="flex h-32 items-center justify-center text-secondary">
                        No hay compañías registradas aún.
                    </div>
                </ng-template>
            </ng-template>
        </div>

        <div
            class="mt-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800"
            *ngIf="error() as errorMsg"
        >
            {{ errorMsg }}
        </div>
    </div>
</div>
