<h2 mat-dialog-title>Crear compañía</h2>
<form [formGroup]="form" class="flex flex-col space-y-4" (ngSubmit)="submit()">
    <mat-dialog-content class="flex flex-col space-y-4">
        <mat-form-field appearance="fill">
            <mat-label>Nombre</mat-label>
            <input matInput formControlName="name" />
            <mat-error *ngIf="form.controls.name.hasError('required')">
                El nombre es obligatorio.
            </mat-error>
            <mat-error *ngIf="form.controls.name.hasError('minlength')">
                Debe tener al menos 3 caracteres.
            </mat-error>
            <mat-error *ngIf="form.controls.name.hasError('maxlength')">
                Máximo 120 caracteres.
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>Propietario (Administrador)</mat-label>
            <mat-select formControlName="ownerUserId">
                <mat-option *ngIf="loadingUsers" [disabled]="true">
                    <div class="flex items-center space-x-2">
                        <mat-progress-spinner
                            diameter="18"
                            mode="indeterminate"
                        ></mat-progress-spinner>
                        <span>Cargando usuarios...</span>
                    </div>
                </mat-option>
                <mat-option
                    *ngFor="let user of users"
                    [value]="user.id"
                >
                    {{ user.displayName || user.email }}
                </mat-option>
            </mat-select>
            <mat-error *ngIf="form.controls.ownerUserId.hasError('required')">
                Selecciona un propietario.
            </mat-error>
        </mat-form-field>

        <div
            class="rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700"
            *ngIf="usersError"
        >
            {{ usersError }}
        </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
        <button mat-button type="button" (click)="close()">Cancelar</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="loadingUsers">
            Crear
        </button>
    </mat-dialog-actions>
</form>
