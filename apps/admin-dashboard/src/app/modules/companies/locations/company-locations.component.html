<div class="flex min-w-0 flex-auto flex-col">
    <div class="flex items-center justify-between px-6 py-4 sm:px-10">
        <div>
            <h1 class="text-2xl font-semibold leading-tight">Sedes</h1>
            <p class="text-secondary text-sm">
                Listado de sedes registradas para la compañía.
            </p>
        </div>
        <div class="flex items-center space-x-2">
            <button mat-stroked-button [routerLink]="['/companies']">
                Volver a compañías
            </button>
            <button mat-flat-button color="primary" (click)="openCreateDialog()">
                Crear sede
            </button>
        </div>
    </div>

    <div class="flex-auto px-6 pb-6 sm:px-10 sm:pb-10">
        <div class="bg-card rounded-2xl p-4 shadow">
            <ng-container *ngIf="!loading; else loadingTpl">
                <table
                    mat-table
                    class="locations-table w-full"
                    *ngIf="locations.length > 0; else emptyTpl"
                    [dataSource]="locations"
                >
                    <ng-container matColumnDef="name">
                        <th mat-header-cell *matHeaderCellDef>Nombre</th>
                        <td mat-cell *matCellDef="let location">
                            {{ location.name }}
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="city">
                        <th mat-header-cell *matHeaderCellDef>Ciudad</th>
                        <td mat-cell *matCellDef="let location">
                            {{ location.address?.city }}
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="country">
                        <th mat-header-cell *matHeaderCellDef>País</th>
                        <td mat-cell *matCellDef="let location">
                            {{ location.address?.country }}
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="schedule">
                        <th mat-header-cell *matHeaderCellDef>Horario</th>
                        <td mat-cell *matCellDef="let location">
                            {{ location.schedule?.length || 0 }} tramos
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef></th>
                        <td mat-cell *matCellDef="let location">
                            <button mat-stroked-button color="primary" disabled>
                                Ver
                            </button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr
                        mat-row
                        *matRowDef="let row; columns: displayedColumns; trackBy: trackById"
                    ></tr>
                </table>

                <ng-template #emptyTpl>
                    <div class="flex h-32 items-center justify-center text-secondary">
                        No hay sedes registradas para esta compañía.
                    </div>
                </ng-template>
            </ng-container>

            <ng-template #loadingTpl>
                <div class="flex h-32 items-center justify-center text-secondary">
                    Cargando sedes...
                </div>
            </ng-template>
        </div>

        <div
            class="mt-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800"
            *ngIf="error as errorMsg"
        >
            {{ errorMsg }}
        </div>
    </div>
</div>
